name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos que exige el despliegue a Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancela el que ya está en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Compilar
        # Pages de proyecto sirve el sitio en /<repo>/, no en la raíz.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Gate de publicación
        # Aborta si en dist/ aparecen cookies, correos, rutas locales o UUID
        # reales. El repositorio de origen tiene una sesión real de NotebookLM:
        # esto es lo que impide que acabe publicada.
        run: npm run check:publish

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
